name: JD Monitor

on:
  workflow_dispatch:
  schedule:
    # 15分おき。TOPページだけ軽くチェックし、変化がなければ
    # main.py がそこで即終了する (main.py 側の --force なし判定)。
    # フルスクレイピングが走るのは実際に値下げ/新商品があった時だけ。
    - cron: "*/15 * * * *"

permissions:
  contents: write

# 前回の実行がまだ終わっていない場合、次の実行は待機させる
# (同時実行によるgit pushの競合を防ぐため)
concurrency:
  group: jd-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run Monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/csv data/history data/watch_signature.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update product state [skip ci]"
            git push
          fi