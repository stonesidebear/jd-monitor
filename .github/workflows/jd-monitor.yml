name: JD Monitor

"on":
  workflow_dispatch:
    inputs:
      force:
        description: "ページ数が前回と同じでも強制的にフルスクレイピングする"
        required: false
        type: boolean
        default: false
  schedule:
    # 10分おき。TOPページ取得だけで分かる data-pagescount (総ページ数) が
    # 前回から変化していなければ、そこでフルスクレイピングをスキップする
    # (main.py参照)。既存商品の追加値下げだけ・ページ数据え置きのケースは
    # 検知できない既知の制約だが、リクエスト数を抑えつつ高頻度化するため
    # 許容している。
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: write

# 前回の実行がまだ終わっていない場合、次の実行は待機させる
# (同時実行によるgit pushの競合を防ぐため)
concurrency:
  group: jd-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run Monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_FULL_SCRAPE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE_FULL_SCRAPE" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/csv data/history data/watch_page_count.txt data/ai_price_cache.json data/mercari_cache.json; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update product state [skip ci]"
            git push
          fi