name: Flannels Monitor

"on":
  workflow_dispatch: {}
  schedule:
    # 24時間に1回。割引率降順ソート+早期打ち切りのおかげで、
    # 15,000件超のカタログでも実際は数十ページで済む(main_flannels.py参照)。
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: flannels-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO_FLANNELS: ${{ secrets.MAIL_TO_FLANNELS }}
        run: |
          # Flannels' Akamai Bot Manager blocks headless Chromium at the
          # HTTP/2 layer (confirmed via manual testing) but not a full,
          # non-headless browser - config_flannels.py sets headless=False,
          # so xvfb-run gives it a virtual display to run in on this
          # headless CI runner.
          xvfb-run -a python main_flannels.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/csv_flannels data/history_flannels data/ai_price_cache.json data/mercari_cache.json; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Flannels product state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt/3), rebasing onto latest main..."
              git fetch origin main
              git rebase origin/main
            done
            echo "Push still failing after retries." >&2
            exit 1
          fi
